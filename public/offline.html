<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b6e69" />
    <title>ScamShield AI｜目前離線</title>
    <style>
      :root {
        font-family: "Noto Sans TC", "Segoe UI", sans-serif;
        color: #17312f;
        background: #eef8f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
        place-items: center;
        background:
          radial-gradient(
            circle at 20% 8%,
            rgba(40, 168, 157, 0.18),
            transparent 28rem
          ),
          #eef8f6;
      }
      main {
        width: min(100%, 520px);
        padding: 30px;
        border: 1px solid #cbe2df;
        border-radius: 24px;
        background: white;
        box-shadow: 0 24px 60px rgba(30, 86, 81, 0.09);
      }
      span {
        display: grid;
        width: 48px;
        height: 52px;
        margin-bottom: 18px;
        place-items: center;
        color: white;
        border-radius: 20px 20px 25px 25px;
        background: #0b6e69;
        font-weight: 900;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.7rem;
      }
      p {
        margin: 0;
        color: #566d69;
        line-height: 1.7;
      }
      button {
        min-height: 46px;
        margin-top: 22px;
        padding: 10px 18px;
        color: white;
        border: 0;
        border-radius: 13px;
        background: #0b6e69;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid rgba(11, 110, 105, 0.3);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">S</span>
      <h1>目前沒有網路連線</h1>
      <p>
        即時分析需要網路。本機 Demo
        只有在先前已完整載入相關靜態資產時，才可能繼續使用。
      </p>
      <button type="button" onclick="location.reload()">重新連線</button>
    </main>
  </body>
</html>
